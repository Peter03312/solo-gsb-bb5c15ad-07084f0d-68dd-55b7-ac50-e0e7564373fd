services:
  weave:
    build:
      context: .
      dockerfile: Dockerfile
    image: periodic-weave-designer:latest
    container_name: periodic-weave-designer
    ports:
      - "${WEAVE_PORT:-8000}:8000"
    environment:
      # 数据库文件位置（容器内）；通过命名卷持久化
      WEAVE_DB_PATH: /data/weave.db
      # 网格规模上限与 K 上限
      WEAVE_MAX_ROWS: "16"
      WEAVE_MAX_COLS: "8"
      WEAVE_MAX_K: "1000000"
    volumes:
      - weave-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/state').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  weave-data:
